[package]
name = "opencovibe-server"
version = "0.2.7"
edition = "2021"
description = "Browser-based UI for Claude Code and Codex"
license = "Apache-2.0"
repository = "https://github.com/ZoomBili/OpenCovibe-web"
homepage = "https://github.com/ZoomBili/OpenCovibe-web"

[lib]
name = "opencovibe_server"
crate-type = ["lib"]

[[bin]]
name = "opencovibe-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
strip-ansi-escapes = "0.2"
notify = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
log = "0.4"
once_cell = "1"
env_logger = "0.11"
sha2 = "0.10"
url = "2"
mime_guess = "2.0"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
include_dir = "0.7"
rand = "0.8"
if-addrs = "0.15.0"
urlencoding = "2"
rayon = "1"
toml = "0.8"
toml_edit = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
